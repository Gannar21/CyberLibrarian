<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CyberLibrarian – AI-powered cybersecurity knowledge assistant">
  <title>CyberLibrarian</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="app">

    <!-- ===== Top bar ===== -->
    <header id="top-bar">
      <div id="logo-area">
        <!-- Shield-check icon -->
        <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
        <span class="logo-text">
          <span class="logo-cyber">Cyber</span><span class="logo-lib">Librarian</span>
        </span>
        <span id="mode-pill" class="mode-pill" hidden aria-hidden="true">MOCK</span>
      </div>

      <div id="header-search-wrap">
        <label for="header-search" class="visually-hidden">Search knowledge base</label>
        <div class="header-search-inner">
          <!-- Search icon -->
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="header-search" type="search" placeholder="Search knowledge base…" autocomplete="off" aria-label="Search knowledge base">
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
        </div>
      </div>

      <div id="header-right">
        <button id="user-menu-btn" class="user-menu-btn" type="button" aria-label="User menu" aria-haspopup="true" aria-expanded="false">
          <span class="user-avatar-small" aria-hidden="true">G</span>
        </button>
        <div id="user-menu" class="user-menu" hidden role="menu" aria-label="User options">
          <button id="theme-toggle-menu" class="menu-item" type="button" role="menuitem">
            <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <span id="theme-toggle-label">Light mode</span>
          </button>
          <!-- Admin download links injected by JS when admin_mode=true -->
          <div id="admin-links"></div>
        </div>
      </div>
    </header>

    <!-- ===== Shell: sidebar + center + aside ===== -->
    <div id="shell">

      <!-- Left sidebar -->
      <nav id="sidebar" aria-label="Main navigation">
        <ul id="sidebar-nav" class="nav-list" role="list">
          <!-- Items built by JS -->
        </ul>
        <div id="sidebar-footer" class="sidebar-footer">
          <!-- test_round label injected by JS -->
        </div>
      </nav>

      <!-- Center content -->
      <main id="center">
        <!-- Chat view -->
        <div id="chat-view" class="view active-view">
          <div id="chat-messages" role="log" aria-live="polite" aria-label="Conversation"></div>
          <div id="input-area">
            <div id="active-filter-tags" role="list" aria-label="Active filters"></div>
            <div id="filter-popover" class="filter-popover" hidden aria-label="Filter options">
              <!-- Populated by JS -->
            </div>
            <div class="input-bar">
              <button id="filter-btn" class="filter-btn" type="button" aria-label="Filters" aria-haspopup="true" aria-expanded="false">
                <!-- Sliders icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="4" y1="6" x2="20" y2="6"/>
                  <line x1="8" y1="12" x2="20" y2="12"/>
                  <line x1="12" y1="18" x2="20" y2="18"/>
                  <circle cx="4" cy="6" r="2"/>
                  <circle cx="8" cy="12" r="2"/>
                  <circle cx="12" cy="18" r="2"/>
                </svg>
                <span id="filter-badge" class="filter-count-badge" hidden aria-hidden="true">0</span>
              </button>
              <div class="input-divider" aria-hidden="true"></div>
              <label for="question-input" class="visually-hidden">Ask a cybersecurity question</label>
              <textarea
                id="question-input"
                class="question-textarea"
                placeholder="Ask about OWASP, NIST, or MITRE ATT&amp;CK…"
                rows="1"
                maxlength="500"
                aria-describedby="char-counter"
              ></textarea>
              <span id="char-counter" class="char-counter" aria-live="polite" aria-atomic="true" hidden></span>
              <button id="send-btn" class="send-btn" type="button" aria-label="Send question" disabled>
                <!-- Send (arrow-up) icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="19" x2="12" y2="5"/>
                  <polyline points="5 12 12 5 19 12"/>
                </svg>
              </button>
            </div>
            <p class="input-hint" id="input-hint-text">
              Enter to send &nbsp;·&nbsp; Shift+Enter for new line &nbsp;·&nbsp; Questions are logged anonymously for a course project.
            </p>
          </div>
        </div>
        <!-- Other views (KB, History, Settings) injected by JS -->
      </main>

      <!-- Right sources panel -->
      <aside id="sources-panel" aria-label="Retrieved Sources">
        <div class="panel-header">
          <svg class="panel-header-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span class="panel-header-title">Retrieved Sources</span>
          <span id="sources-count" class="sources-count" hidden aria-hidden="true"></span>
        </div>
        <div id="sources-list" aria-live="polite" aria-label="Source cards"></div>
      </aside>

    </div><!-- #shell -->

    <!-- Mobile bottom tab bar (hidden on large screens) -->
    <nav id="bottom-tabs" aria-label="Mobile navigation" hidden>
      <!-- Built by JS -->
    </nav>

    <!-- Mobile sources drawer -->
    <div id="sources-drawer" hidden role="dialog" aria-label="Retrieved Sources" aria-modal="true">
      <div class="drawer-header">
        <span class="drawer-title">Retrieved Sources</span>
        <button id="drawer-close-btn" class="drawer-close-btn" type="button" aria-label="Close sources drawer">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="drawer-sources-list"></div>
    </div>
    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

  </div><!-- #app -->
</body>
</html>
